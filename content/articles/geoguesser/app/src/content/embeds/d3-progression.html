<div class="d3-progression" style="width:100%;margin:14px 0;min-height:460px;"></div>

<style>
  .d3-progression {
    border: 1px solid var(--border-color);
    border-radius: 10px;
    background: var(--surface-bg);
    padding: 18px 16px 12px;
    position: relative;
  }
  .d3-progression svg { display: block; width: 100%; height: auto; overflow: visible; }
  .d3-progression .axis text { fill: var(--muted-color); font-size: 10.5px; }
  .d3-progression .axis line,
  .d3-progression .axis path { stroke: var(--border-color); }
  .d3-progression .grid line { stroke: var(--border-color); stroke-opacity: 0.45; }
  .d3-progression .panel-title {
    fill: var(--text-color); font-size: 12px; font-weight: 650;
  }
  .d3-progression .panel-sub { fill: var(--muted-color); font-size: 10.5px; }
  .d3-progression .line { fill: none; stroke-width: 2; }
  .d3-progression .line.score { stroke: var(--primary-color); }
  .d3-progression .line.other { stroke: color-mix(in oklab, var(--muted-color) 65%, var(--surface-bg)); }
  .d3-progression .dot { stroke: var(--surface-bg); stroke-width: 1.5; }
  .d3-progression .dot.score { fill: var(--primary-color); }
  .d3-progression .dot.other { fill: color-mix(in oklab, var(--muted-color) 65%, var(--surface-bg)); }
  .d3-progression .plateau { stroke: var(--border-color); stroke-dasharray: 4 3; }
  .d3-progression .plateau-label {
    fill: var(--muted-color); font-size: 10px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .d3-progression .caption { fill: var(--muted-color); font-size: 11px; font-style: italic; }
</style>

<script>
  (function () {
    const ensureD3 = (cb) => {
      if (window.d3 && typeof window.d3.select === 'function') return cb();
      const existing = document.querySelector('script[data-d3]');
      if (existing) { existing.addEventListener('load', () => cb(), { once: true }); return; }
      const s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js';
      s.setAttribute('data-d3', '1');
      s.addEventListener('load', () => cb(), { once: true });
      document.head.appendChild(s);
    };

    const PATHS = [
      '/data/run1-progression.json',
      './assets/data/run1-progression.json',
      '../assets/data/run1-progression.json',
      '../../assets/data/run1-progression.json'
    ];

    const fetchFirst = async (paths) => {
      for (const p of paths) {
        try { const r = await fetch(p, { cache: 'no-cache' }); if (r.ok) return await r.json(); }
        catch (_) {}
      }
      return null;
    };

    // Four small multiples. Score rises while every measure of effort falls.
    const PANELS = [
      { key: 'mean',       title: 'Eval score',      sub: 'mean-of-4',     kind: 'score', fmt: v => v.toFixed(3) },
      { key: 'turns',      title: 'Turns',           sub: 'per episode',   kind: 'other', fmt: v => v.toFixed(1) },
      { key: 'tokens_out', title: 'Output tokens',   sub: 'per episode',   kind: 'other', fmt: v => String(v) },
      { key: 'zero_pct',   title: 'Scored zero',    sub: '% of episodes', kind: 'other', fmt: v => v + '%' }
    ];

    const render = (root, rows) => {
      const d3 = window.d3;
      root.innerHTML = '';

      const W = Math.max(520, root.clientWidth - 32);
      const cols = W < 680 ? 1 : 2;
      const panelW = W / cols;
      const panelH = 168;
      const rowsN = Math.ceil(PANELS.length / cols);
      const H = rowsN * panelH + 34;

      const svg = d3.select(root).append('svg')
        .attr('viewBox', `0 0 ${W} ${H}`)
        .attr('role', 'img')
        .attr('aria-label', 'Run 1 behaviour across checkpoints');

      const M = { top: 34, right: 20, bottom: 30, left: 46 };
      const x = d3.scaleLinear().domain([0, d3.max(rows, d => d.step)]).range([0, panelW - M.left - M.right]);

      PANELS.forEach((p, i) => {
        const cx = (i % cols) * panelW;
        const cy = Math.floor(i / cols) * panelH;
        const g = svg.append('g').attr('transform', `translate(${cx + M.left},${cy + M.top})`);
        const ih = panelH - M.top - M.bottom;

        const vals = rows.map(d => d[p.key]);
        const y = d3.scaleLinear()
          .domain([Math.min(0, d3.min(vals)), d3.max(vals) * 1.12])
          .range([ih, 0]);

        g.append('g').attr('class', 'grid')
          .selectAll('line').data(y.ticks(4)).join('line')
          .attr('x1', 0).attr('x2', panelW - M.left - M.right)
          .attr('y1', d => y(d)).attr('y2', d => y(d));

        // step 200 is where the score plateaus; everything after it bought nothing
        g.append('line').attr('class', 'plateau')
          .attr('x1', x(200)).attr('x2', x(200)).attr('y1', 0).attr('y2', ih);
        if (i === 0) {
          g.append('text').attr('class', 'plateau-label')
            .attr('x', x(200) + 5).attr('y', 10).text('plateau');
        }

        const line = d3.line().x(d => x(d.step)).y(d => y(d[p.key])).curve(d3.curveMonotoneX);
        g.append('path').datum(rows).attr('class', `line ${p.kind}`).attr('d', line);

        g.selectAll('circle').data(rows).join('circle')
          .attr('class', `dot ${p.kind}`)
          .attr('cx', d => x(d.step)).attr('cy', d => y(d[p.key])).attr('r', 3.2);

        g.append('g').attr('class', 'axis')
          .attr('transform', `translate(0,${ih})`)
          .call(d3.axisBottom(x).ticks(4).tickSizeOuter(0));
        g.append('g').attr('class', 'axis')
          .call(d3.axisLeft(y).ticks(4).tickFormat(p.fmt).tickSizeOuter(0));

        svg.append('text').attr('class', 'panel-title')
          .attr('x', cx + M.left).attr('y', cy + 16).text(p.title);
        svg.append('text').attr('class', 'panel-sub')
          .attr('x', cx + M.left).attr('y', cy + 28).text(p.sub);
      });

      svg.append('text').attr('class', 'caption')
        .attr('x', M.left).attr('y', H - 6)
        .text('Run 1, base through step 1000 · x axis is training step');
    };

    const bootstrap = () => {
      const nodes = document.querySelectorAll('.d3-progression');
      if (!nodes.length) return;
      ensureD3(async () => {
        const rows = await fetchFirst(PATHS);
        nodes.forEach((root) => {
          if (root.getAttribute('data-mounted')) return;
          root.setAttribute('data-mounted', '1');
          if (!rows) {
            root.innerHTML = '<div style="padding:24px;color:var(--muted-color);font-size:13px">' +
              'run1-progression.json not found. Expected at /data/run1-progression.json</div>';
            return;
          }
          render(root, rows);
          let t;
          window.addEventListener('resize', () => {
            clearTimeout(t); t = setTimeout(() => render(root, rows), 150);
          });
        });
      });
    };

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', bootstrap);
    } else { bootstrap(); }
  })();
</script>
