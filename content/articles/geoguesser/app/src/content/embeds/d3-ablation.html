<div class="d3-ablation" style="width:100%;margin:14px 0;min-height:320px;"></div>

<style>
  .d3-ablation {
    border: 1px solid var(--border-color);
    border-radius: 10px;
    background: var(--surface-bg);
    padding: 18px 16px 12px;
    position: relative;
  }
  .d3-ablation svg { display: block; width: 100%; height: auto; overflow: visible; }
  .d3-ablation .axis text { fill: var(--muted-color); font-size: 11px; }
  .d3-ablation .axis line,
  .d3-ablation .axis path { stroke: var(--border-color); }
  .d3-ablation .grid line { stroke: var(--border-color); stroke-opacity: 0.45; }
  .d3-ablation .run { fill: var(--text-color); font-size: 12.5px; }
  .d3-ablation .run.lead { font-weight: 650; }
  .d3-ablation .cfg {
    fill: var(--muted-color); font-size: 10px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .d3-ablation .ci { stroke: var(--text-color); stroke-width: 1.2; }
  .d3-ablation .pt { stroke: var(--surface-bg); stroke-width: 1.5; }
  .d3-ablation .pt.lead { fill: var(--primary-color); }
  .d3-ablation .pt.rest { fill: color-mix(in oklab, var(--muted-color) 60%, var(--surface-bg)); }
  .d3-ablation .val {
    fill: var(--text-color); font-size: 11.5px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-variant-numeric: tabular-nums;
  }
  .d3-ablation .zero { stroke: var(--border-color); stroke-dasharray: 3 3; }
  .d3-ablation .caption { fill: var(--muted-color); font-size: 11px; font-style: italic; }
</style>

<script>
  (function () {
    const ensureD3 = (cb) => {
      if (window.d3 && typeof window.d3.select === 'function') return cb();
      const existing = document.querySelector('script[data-d3]');
      if (existing) { existing.addEventListener('load', () => cb(), { once: true }); return; }
      const s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js';
      s.setAttribute('data-d3', '1');
      s.addEventListener('load', () => cb(), { once: true });
      document.head.appendChild(s);
    };

    const PATHS = [
      '/data/runs-ablation.json',
      './assets/data/runs-ablation.json',
      '../assets/data/runs-ablation.json',
      '../../assets/data/runs-ablation.json'
    ];

    const fetchFirst = async (paths) => {
      for (const p of paths) {
        try { const r = await fetch(p, { cache: 'no-cache' }); if (r.ok) return await r.json(); }
        catch (_) {}
      }
      return null;
    };

    const render = (root, rows) => {
      const d3 = window.d3;
      root.innerHTML = '';

      const M = { top: 30, right: 66, bottom: 40, left: 210 };
      const W = Math.max(540, root.clientWidth - 32);
      const rowH = 46;
      const H = rows.length * rowH;

      const svg = d3.select(root).append('svg')
        .attr('viewBox', `0 0 ${W} ${H + M.top + M.bottom}`)
        .attr('role', 'img')
        .attr('aria-label', 'Paired gain per run with 95% confidence intervals');

      const g = svg.append('g').attr('transform', `translate(${M.left},${M.top})`);
      const iw = W - M.left - M.right;

      const hi = d3.max(rows, d => d.gain + d.ci) * 1.1;
      const x = d3.scaleLinear().domain([0, hi]).range([0, iw]);
      const y = d3.scaleBand().domain(rows.map(d => d.run)).range([0, H]).padding(0.4);

      g.append('g').attr('class', 'grid')
        .selectAll('line').data(x.ticks(5)).join('line')
        .attr('x1', d => x(d)).attr('x2', d => x(d)).attr('y1', 0).attr('y2', H);

      g.append('line').attr('class', 'zero')
        .attr('x1', x(0)).attr('x2', x(0)).attr('y1', 0).attr('y2', H);

      const item = g.selectAll('g.item').data(rows).join('g').attr('class', 'item');
      const cy = d => y(d.run) + y.bandwidth() / 2;
      const lead = d => d.run === 'run 1';

      // 95% CI whisker
      item.append('line').attr('class', 'ci')
        .attr('x1', d => x(Math.max(0, d.gain - d.ci))).attr('x2', d => x(d.gain + d.ci))
        .attr('y1', cy).attr('y2', cy);
      item.append('line').attr('class', 'ci')
        .attr('x1', d => x(Math.max(0, d.gain - d.ci))).attr('x2', d => x(Math.max(0, d.gain - d.ci)))
        .attr('y1', d => cy(d) - 5).attr('y2', d => cy(d) + 5);
      item.append('line').attr('class', 'ci')
        .attr('x1', d => x(d.gain + d.ci)).attr('x2', d => x(d.gain + d.ci))
        .attr('y1', d => cy(d) - 5).attr('y2', d => cy(d) + 5);

      item.append('circle')
        .attr('class', d => `pt ${lead(d) ? 'lead' : 'rest'}`)
        .attr('cx', d => x(d.gain)).attr('cy', cy).attr('r', 5.5);

      item.append('text')
        .attr('class', d => `run ${lead(d) ? 'lead' : ''}`)
        .attr('x', -12).attr('y', d => cy(d) - 5).attr('text-anchor', 'end')
        .text(d => `${d.run} · ${d.model}`);

      item.append('text').attr('class', 'cfg')
        .attr('x', -12).attr('y', d => cy(d) + 9).attr('text-anchor', 'end')
        .text(d => `scale=${d.scale_rewards} beta=${d.beta} tasks/step=${d.tasks_per_step} cost=${d.cost_scale}`);

      item.append('text').attr('class', 'val')
        .attr('x', d => x(d.gain + d.ci) + 8).attr('y', cy).attr('dy', '0.35em')
        .text(d => `+${d.gain.toFixed(4)}`);

      g.append('g').attr('class', 'axis')
        .attr('transform', `translate(0,${H})`)
        .call(d3.axisBottom(x).ticks(5).tickSizeOuter(0));

      svg.append('text').attr('class', 'caption')
        .attr('x', M.left).attr('y', H + M.top + 32)
        .text('Paired gain over each run’s own base arm, same sweep · whiskers are 95% CI');
    };

    const bootstrap = () => {
      const nodes = document.querySelectorAll('.d3-ablation');
      if (!nodes.length) return;
      ensureD3(async () => {
        const rows = await fetchFirst(PATHS);
        nodes.forEach((root) => {
          if (root.getAttribute('data-mounted')) return;
          root.setAttribute('data-mounted', '1');
          if (!rows) {
            root.innerHTML = '<div style="padding:24px;color:var(--muted-color);font-size:13px">' +
              'runs-ablation.json not found. Expected at /data/runs-ablation.json</div>';
            return;
          }
          render(root, rows);
          let t;
          window.addEventListener('resize', () => {
            clearTimeout(t); t = setTimeout(() => render(root, rows), 150);
          });
        });
      });
    };

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', bootstrap);
    } else { bootstrap(); }
  })();
</script>
