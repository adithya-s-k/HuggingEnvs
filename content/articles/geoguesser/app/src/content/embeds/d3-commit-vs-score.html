<div class="cv" style="width:100%;margin:14px 0;min-height:400px;">
  <div class="cv__frame">
    <div class="cv__chart"></div>
    <div class="cv__foot">
      <p class="cv__stat"></p>
      <p class="cv__note">
        Every point is one model on the same 200 held-out tasks, scored mean-of-4. Marker size is
        the share of its episodes that scored exactly zero, which on the game curve means a guess
        beyond about 3,300 km. The two arms we trained are marked, and the line is fitted to the nine
        models we did not.
      </p>
    </div>
  </div>
</div>

<style>
  .cv__frame {
    border: 1px solid var(--border-color);
    border-radius: 10px;
    background: var(--surface-bg);
    padding: 15px 15px 13px;
    position: relative;
  }
  .cv__chart svg { display: block; width: 100%; height: auto; overflow: visible; }
  .cv .grid { stroke: var(--border-color); stroke-opacity: 0.5; stroke-width: 0.6; }
  .cv .axis-lbl, .cv .tick {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 9.5px;
    fill: var(--muted-color);
  }
  .cv .fit {
    fill: none;
    stroke: color-mix(in oklab, var(--muted-color) 60%, transparent);
    stroke-width: 1.1;
    stroke-dasharray: 5 3;
  }
  .cv .dot {
    fill: color-mix(in oklab, var(--muted-color) 55%, var(--surface-bg));
    stroke: var(--muted-color);
    stroke-width: 0.9;
  }
  .cv .dot--ours { fill: var(--primary-color); stroke: var(--surface-bg); stroke-width: 1.2; }
  .cv .dot--base {
    fill: none;
    stroke: var(--text-color);
    stroke-width: 1.4;
    stroke-dasharray: 3 2;
  }
  .cv .lbl {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 9px;
    fill: var(--muted-color);
  }
  .cv .lbl--ours { fill: var(--primary-color); }
  .cv .lbl--base { fill: var(--text-color); }
  .cv .arrow { stroke: color-mix(in oklab, var(--primary-color) 60%, transparent); stroke-width: 1; }

  .cv__foot { margin-top: 10px; }
  .cv__stat {
    margin: 0 0 6px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11px;
    color: var(--text-color);
  }
  .cv__stat b { color: var(--primary-color); }
  .cv__note {
    margin: 0;
    font-size: 11px;
    line-height: 1.55;
    color: var(--muted-color);
  }
</style>

<script>
  (function () {
    const PATHS = [
      '/data/board.json',
      './assets/data/board.json',
      '../assets/data/board.json',
      '../../assets/data/board.json'
    ];
    const ns = 'http://www.w3.org/2000/svg';
    const el = (name, attrs, text) => {
      const n = document.createElementNS(ns, name);
      Object.entries(attrs).forEach(([k, v]) => n.setAttribute(k, v));
      if (text !== undefined) n.textContent = text;
      return n;
    };

    const fetchFirst = async (paths) => {
      for (const p of paths) {
        try { const r = await fetch(p, { cache: 'no-cache' }); if (r.ok) return await r.json(); }
        catch (_) { /* next */ }
      }
      return null;
    };

    const pearson = (x, y) => {
      const n = x.length;
      const mx = x.reduce((a, b) => a + b, 0) / n;
      const my = y.reduce((a, b) => a + b, 0) / n;
      let num = 0, dx = 0, dy = 0;
      for (let i = 0; i < n; i++) {
        num += (x[i] - mx) * (y[i] - my);
        dx += (x[i] - mx) ** 2;
        dy += (y[i] - my) ** 2;
      }
      return num / Math.sqrt(dx * dy);
    };

    const render = (root, rows) => {
      const host = root.querySelector('.cv__chart');
      host.innerHTML = '';

      const W = 860, H = 330;
      const M = { l: 42, r: 18, t: 16, b: 34 };
      const iw = W - M.l - M.r, ih = H - M.t - M.b;
      const svg = el('svg', {
        viewBox: `0 0 ${W} ${H}`, role: 'img',
        'aria-label': 'Turns per episode against score, for every model on the board'
      });
      host.appendChild(svg);

      const xMax = Math.ceil(Math.max(...rows.map((r) => r.turns)) + 1);
      const yMin = 0.3, yMax = 0.75;
      const X = (v) => M.l + (v / xMax) * iw;
      const Y = (v) => M.t + (1 - (v - yMin) / (yMax - yMin)) * ih;

      for (let v = 0.3; v <= 0.75001; v += 0.1) {
        svg.appendChild(el('line', { class: 'grid', x1: M.l, x2: W - M.r, y1: Y(v), y2: Y(v) }));
        svg.appendChild(el('text', {
          class: 'tick', x: M.l - 7, y: Y(v) + 3, 'text-anchor': 'end'
        }, v.toFixed(1)));
      }
      for (let v = 0; v <= xMax; v += 2) {
        svg.appendChild(el('text', {
          class: 'tick', x: X(v), y: H - 18, 'text-anchor': 'middle'
        }, String(v)));
      }
      svg.appendChild(el('text', {
        class: 'axis-lbl', x: M.l + iw / 2, y: H - 4, 'text-anchor': 'middle'
      }, 'turns per episode'));
      svg.appendChild(el('text', {
        class: 'axis-lbl', x: M.l - 7, y: M.t - 5, 'text-anchor': 'end'
      }, 'score'));

      // Fit on the models we did not train, so the line is not shaped by our own
      // checkpoints sitting at one turn.
      const refs = rows.filter((r) => r.kind === 'reference');
      const rx = refs.map((r) => r.turns), ry = refs.map((r) => r.mean);
      const n = rx.length;
      const mx = rx.reduce((a, b) => a + b, 0) / n, my = ry.reduce((a, b) => a + b, 0) / n;
      const slope = rx.reduce((a, v, i) => a + (v - mx) * (ry[i] - my), 0)
        / rx.reduce((a, v) => a + (v - mx) ** 2, 0);
      const at = (t) => my + slope * (t - mx);
      svg.appendChild(el('line', {
        class: 'fit', x1: X(1), y1: Y(at(1)), x2: X(xMax - 0.5), y2: Y(at(xMax - 0.5))
      }));

      const zeroMax = Math.max(...rows.map((r) => r.zero_pct || 0)) || 1;
      const radius = (r) => 3.2 + 5.5 * Math.sqrt((r.zero_pct || 0) / zeroMax);

      // Labels are nudged apart in y where two models sit on top of each
      // other, keeping the dots where the data puts them.
      const placed = [];
      const nudge = (y) => {
        let out = y;
        let moved = true;
        while (moved) {
          moved = false;
          for (const p of placed) {
            if (Math.abs(out - p) < 10) { out = p + 10; moved = true; }
          }
        }
        placed.push(out);
        return out;
      };

      [...rows]
        .sort((a, b) => b.mean - a.mean)
        .forEach((r) => {
          const cls = r.kind === 'ours' ? 'dot dot--ours'
            : r.kind === 'base' ? 'dot dot--base' : 'dot';
          svg.appendChild(el('circle', {
            class: cls, cx: X(r.turns), cy: Y(r.mean), r: radius(r)
          }));
          const right = r.turns < xMax * 0.72;
          const ly = nudge(Y(r.mean) + 3);
          svg.appendChild(el('text', {
            class: `lbl${r.kind === 'ours' ? ' lbl--ours' : r.kind === 'base' ? ' lbl--base' : ''}`,
            x: X(r.turns) + (right ? radius(r) + 5 : -(radius(r) + 5)),
            y: ly,
            'text-anchor': right ? 'start' : 'end'
          }, r.name.replace(' (untrained)', '')));
        });

      // The move training made, drawn as the arrow it actually is.
      const base = rows.find((r) => r.kind === 'base');
      const ours = rows.find((r) => r.kind === 'ours');
      if (base && ours) {
        svg.appendChild(el('path', {
          class: 'arrow',
          d: `M${X(base.turns) - 4},${Y(base.mean) - 6}Q${X(3.5)},${Y(0.72)} ${X(ours.turns) + 6},${Y(ours.mean) - 8}`,
          fill: 'none'
        }));
        svg.appendChild(el('text', {
          class: 'lbl lbl--ours', x: X(3.6), y: Y(0.735), 'text-anchor': 'middle'
        }, 'what training did: fewer turns, higher score'));
      }

      const r = pearson(rx, ry);
      root.querySelector('.cv__stat').innerHTML =
        `across the ${n} models we did not train, score against turns per episode: ` +
        `<b>r = ${r.toFixed(2)}</b>`;
    };

    const bootstrap = async () => {
      const nodes = document.querySelectorAll('.cv');
      if (!nodes.length) return;
      const rows = await fetchFirst(PATHS);
      nodes.forEach((root) => {
        if (root.getAttribute('data-mounted')) return;
        root.setAttribute('data-mounted', '1');
        if (!rows) {
          root.innerHTML = '<div style="padding:24px;color:var(--muted-color);font-size:13px">' +
            'board.json not found. Expected at /data/board.json</div>';
          return;
        }
        render(root, rows);
        let t;
        window.addEventListener('resize', () => {
          clearTimeout(t);
          t = setTimeout(() => render(root, rows), 180);
        });
      });
    };

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', bootstrap);
    } else {
      bootstrap();
    }
  })();
</script>
