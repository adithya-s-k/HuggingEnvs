<div class="d3-deploy" style="width:100%;margin:14px 0;"></div>

<style>
  .d3-deploy {
    display: flex;
    flex-direction: column;
    gap: 10px;
    align-items: flex-start;
    justify-content: center;
    min-height: 210px;
    padding: 28px 26px;
    border: 1px dashed var(--border-color);
    border-radius: 10px;
    background: color-mix(in oklab, var(--primary-color) 4%, transparent);
  }
  .d3-deploy .ph-tag {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--primary-color);
  }
  .d3-deploy .ph-title { font-size: 17px; font-weight: 650; color: var(--text-color); }
  .d3-deploy .ph-desc { font-size: 14px; line-height: 1.55; color: var(--muted-color); max-width: 64ch; }
  .d3-deploy .ph-file {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px; color: var(--muted-color);
    padding: 3px 7px; border: 1px solid var(--border-color);
    border-radius: 5px; background: var(--surface-bg);
  }
</style>

<script>
  (function () {
    function bootstrap() {
      var nodes = document.querySelectorAll('.d3-deploy');
      for (var i = 0; i < nodes.length; i++) {
        var root = nodes[i];
        if (root.getAttribute('data-mounted')) continue;
        root.setAttribute('data-mounted', '1');
        root.innerHTML =
          '<div class="ph-tag">Visualization to build</div>' +
          '<div class="ph-title">Three artifacts, split by what each is good at</div>' +
          '<div class="ph-desc">Bucket, dataset repo and Space, and what flows between them. Show the read-only /data mount, and that the trainer and the eval both reach the same hosted environment over HTTP. Mark where the session cap of 4 bites.</div>' +
          '<div class="ph-file">d3-deploy.html</div>';
      }
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', bootstrap);
    } else { bootstrap(); }
  })();
</script>
