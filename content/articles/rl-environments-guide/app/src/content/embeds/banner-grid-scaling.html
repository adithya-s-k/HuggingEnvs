<div class="d3-env-grid-scaling" style="width:100%;margin:10px 0;aspect-ratio:3/1;min-height:280px;"></div>
<style>
    .d3-env-grid-scaling { position: relative; }
    .d3-env-grid-scaling canvas {
        display: block;
        width: 100%;
        height: 100%;
        cursor: crosshair;
    }
    .d3-env-grid-scaling .scale-counter {
        position: absolute;
        top: 14px;
        left: 18px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 1.0px;
        text-transform: uppercase;
        color: var(--muted-color);
        pointer-events: none;
        z-index: 5;
        font-variant-numeric: tabular-nums;
    }
    .d3-env-grid-scaling .scale-counter strong {
        color: var(--text-color);
        font-weight: 800;
        font-size: 16px;
        margin-right: 4px;
        letter-spacing: 0;
    }
    .d3-env-grid-scaling .scale-counter .div {
        opacity: 0.5;
        margin: 0 4px;
    }
    .d3-env-grid-scaling .d3-tooltip {
        position: absolute;
        top: 0; left: 0;
        transform: translate(-9999px, -9999px);
        pointer-events: none;
        padding: 10px 12px;
        border-radius: 12px;
        font-size: 12px;
        line-height: 1.35;
        border: 1px solid var(--border-color);
        background: var(--surface-bg);
        color: var(--text-color);
        box-shadow: 0 8px 32px rgba(0,0,0,0.28), 0 2px 8px rgba(0,0,0,0.12);
        opacity: 0;
        transition: opacity 0.12s ease;
        backdrop-filter: saturate(1.12) blur(8px);
        z-index: 20;
        min-width: 180px;
    }
    .d3-env-grid-scaling .d3-tooltip__inner {
        text-align: left;
        display: flex;
        flex-direction: column;
        gap: 4px;
    }
</style>
<script>
    (() => {
        const ensureD3 = (cb) => {
            if (window.d3 && typeof window.d3.select === 'function') return cb();
            let s = document.getElementById('d3-cdn-script');
            if (!s) {
                s = document.createElement('script');
                s.id = 'd3-cdn-script';
                s.src = 'https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js';
                document.head.appendChild(s);
            }
            const onReady = () => { if (window.d3 && typeof window.d3.select === 'function') cb(); };
            s.addEventListener('load', onReady, { once: true });
            if (window.d3) onReady();
        };

        const bootstrap = () => {
            const scriptEl = document.currentScript;
            let container = scriptEl ? scriptEl.previousElementSibling : null;
            if (!(container && container.classList && container.classList.contains('d3-env-grid-scaling'))) {
                const cands = Array.from(document.querySelectorAll('.d3-env-grid-scaling'))
                    .filter((el) => !(el.dataset && el.dataset.mounted === 'true'));
                container = cands[cands.length - 1] || null;
            }
            if (!container) return;
            if (container.dataset) {
                if (container.dataset.mounted === 'true') return;
                container.dataset.mounted = 'true';
            }

            // ─── Color gradient (matches galaxy banner) ───
            const c0 = d3.rgb(78, 165, 183);
            const c1 = d3.rgb(206, 192, 250);
            const c2 = d3.rgb(232, 137, 171);
            const interp01 = d3.interpolateRgb(c0, c1);
            const interp12 = d3.interpolateRgb(c1, c2);
            const colorFor = (v) => {
                const t = Math.max(0, Math.min(1, v));
                return t <= 0.5 ? interp01(t / 0.5) : interp12((t - 0.5) / 0.5);
            };

            // Easing helpers
            const easeInOutCubic = (t) => t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;
            const easeInOutSine  = (t) => -(Math.cos(Math.PI * t) - 1) / 2;
            const easeOutCubic   = (t) => 1 - Math.pow(1 - t, 3);

            container.style.position = container.style.position || 'relative';
            const canvas = document.createElement('canvas');
            container.appendChild(canvas);
            const ctx = canvas.getContext('2d');

            // Counter overlay
            const counterEl = document.createElement('div');
            counterEl.className = 'scale-counter';
            counterEl.innerHTML = `<strong id="cnt-num">0</strong><span class="div">/</span><span id="cnt-tot">0</span> <span style="opacity:0.6">concurrent environments</span>`;
            container.appendChild(counterEl);
            const cntNum = counterEl.querySelector('#cnt-num');
            const cntTot = counterEl.querySelector('#cnt-tot');

            // Tooltip
            let tip = container.querySelector('.d3-tooltip');
            let tipInner;
            if (!tip) {
                tip = document.createElement('div');
                tip.className = 'd3-tooltip';
                tipInner = document.createElement('div');
                tipInner.className = 'd3-tooltip__inner';
                tip.appendChild(tipInner);
                container.appendChild(tip);
            } else {
                tipInner = tip.querySelector('.d3-tooltip__inner') || tip;
            }

            // ─── Layout & grid state ───
            // Internal padding inside the canvas — keeps the grid from hugging edges,
            // and reserves room at the top for the counter.
            const PAD_TOP = 44;
            const PAD_BOTTOM = 28;
            const PAD_X = 22;

            let cells = [];
            let activationOrder = [];
            let cols = 0, rows = 0;
            let cellW = 0, cellH = 0;
            let gridX = 0, gridY = 0, gridW = 0, gridH = 0;
            let widthPx = 0, heightPx = 0;
            let dpr = Math.max(1, window.devicePixelRatio || 1);
            let hoverCell = -1;
            let rafId = null;
            let frame = 0;

            // ─── Animation timing (tuned for calm, eased motion) ───
            const SCALE_FRAMES   = 600;        // ~10s at 60fps to fill the grid (slower wave-in)
            const HOLD_AFTER_SCALE = 120;      // longer pause before episodes start ending
            const SPAWN_DURATION = 54;         // longer fade-in for activation pulse
            const FLASH_DURATION = 60;         // gentler, longer fade-in/out for episode flash
            const TARGET_DUR_MIN = 120;
            const TARGET_DUR_MAX = 240;
            const TRAIL_LEN = 5;
            const TRAIL_DRAW_EVERY = 3;        // only push to trail every N frames (smoother, less crowded)

            const reducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

            const randStepMax = () => 260 + Math.floor(Math.random() * 280); // 260–540 (much rarer episode ends)

            const makeAgent = () => {
                const x0 = 0.18 + Math.random() * 0.64;
                const y0 = 0.18 + Math.random() * 0.64;
                return {
                    x: x0, y: y0,
                    sx: x0, sy: y0,                       // segment start
                    tx: 0.18 + Math.random() * 0.64,      // segment target
                    ty: 0.18 + Math.random() * 0.64,
                    progress: Math.random(),              // 0..1 inside the current segment
                    duration: TARGET_DUR_MIN + Math.random() * (TARGET_DUR_MAX - TARGET_DUR_MIN),
                    trailTick: Math.floor(Math.random() * TRAIL_DRAW_EVERY),
                    trail: []
                };
            };

            const initCell = (i) => {
                const max = randStepMax();
                const numAgents = Math.random() < 0.14 ? 2 : 1;
                const agents = [];
                for (let a = 0; a < numAgents; a++) agents.push(makeAgent());
                return {
                    id: i,
                    activated: false,
                    activationFrame: -1,
                    spawnTimer: 0,
                    step: 0,
                    max,
                    phase: 'exploring',
                    flashTimer: 0,
                    flashColor: null,
                    agents,
                };
            };

            const respawn = (cell) => {
                cell.step = 0;
                cell.max = randStepMax();
                cell.phase = 'exploring';
                cell.flashTimer = 0;
                cell.flashColor = null;
                cell.spawnTimer = SPAWN_DURATION;          // gentle re-emerge after flash
                const numAgents = Math.random() < 0.14 ? 2 : 1;
                cell.agents = [];
                for (let a = 0; a < numAgents; a++) cell.agents.push(makeAgent());
            };

            const computeLayout = () => {
                const rect = container.getBoundingClientRect();
                widthPx = Math.max(1, Math.round(rect.width));
                heightPx = Math.max(1, Math.round(rect.height));
                dpr = Math.max(1, window.devicePixelRatio || 1);

                canvas.style.width = widthPx + 'px';
                canvas.style.height = heightPx + 'px';
                canvas.width = Math.round(widthPx * dpr);
                canvas.height = Math.round(heightPx * dpr);
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

                // Grid lives inside the padded inner box
                gridX = PAD_X;
                gridY = PAD_TOP;
                gridW = Math.max(1, widthPx - PAD_X * 2);
                gridH = Math.max(1, heightPx - PAD_TOP - PAD_BOTTOM);

                const targetCellSize = Math.max(20, gridW / 26);
                const newCols = Math.max(8, Math.round(gridW / targetCellSize));
                cellW = gridW / newCols;
                const newRows = Math.max(4, Math.round(gridH / cellW));
                cellH = gridH / newRows;

                if (newCols !== cols || newRows !== rows) {
                    cols = newCols;
                    rows = newRows;
                    cells = new Array(cols * rows);
                    for (let i = 0; i < cells.length; i++) cells[i] = initCell(i);

                    // Activation order: wave from center outward, with small jitter
                    const cxCol = (cols - 1) / 2;
                    const cyRow = (rows - 1) / 2;
                    const indices = d3.range(cells.length);
                    indices.sort((a, b) => {
                        const ax = a % cols, ay = Math.floor(a / cols);
                        const bx = b % cols, by = Math.floor(b / cols);
                        const ad = Math.hypot(ax - cxCol, ay - cyRow);
                        const bd = Math.hypot(bx - cxCol, by - cyRow);
                        return (ad + (Math.random() - 0.5) * 0.5) - (bd + (Math.random() - 0.5) * 0.5);
                    });
                    activationOrder = indices;

                    for (let k = 0; k < activationOrder.length; k++) {
                        const i = activationOrder[k];
                        // Eased activation distribution — slightly faster toward the end of the scale
                        const norm = k / activationOrder.length;
                        const eased = easeInOutSine(norm);
                        cells[i].activationFrame = Math.floor(eased * SCALE_FRAMES);
                    }

                    cntTot.textContent = String(cells.length);
                    cntNum.textContent = '0';
                }
            };

            const getThemeColors = () => {
                const styles = getComputedStyle(document.documentElement);
                let border = styles.getPropertyValue('--border-color').trim() || 'rgba(0,0,0,0.12)';
                let surface = styles.getPropertyValue('--surface-bg').trim() || '#ffffff';
                const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
                return { border, surface, isDark };
            };

            const toRgba = (color, alpha) => {
                ctx.save();
                ctx.fillStyle = '#000';
                ctx.fillStyle = color;
                const parsed = ctx.fillStyle;
                ctx.restore();
                if (parsed.startsWith('#')) {
                    const r = parseInt(parsed.slice(1, 3), 16);
                    const g = parseInt(parsed.slice(3, 5), 16);
                    const b = parseInt(parsed.slice(5, 7), 16);
                    return `rgba(${r}, ${g}, ${b}, ${alpha})`;
                }
                const m = parsed.match(/rgba?\(([^)]+)\)/);
                if (m) {
                    const parts = m[1].split(',').map((s) => s.trim());
                    return `rgba(${parts[0]}, ${parts[1]}, ${parts[2]}, ${alpha})`;
                }
                return parsed;
            };

            const tickPhysics = () => {
                let activeCount = 0;
                for (let i = 0; i < cells.length; i++) {
                    const c = cells[i];

                    // Activation gate
                    if (!c.activated) {
                        if (frame >= c.activationFrame) {
                            c.activated = true;
                            c.spawnTimer = SPAWN_DURATION;
                            c.step = Math.floor(Math.random() * c.max * 0.25);
                        } else {
                            continue;
                        }
                    }
                    activeCount += 1;
                    if (c.spawnTimer > 0) c.spawnTimer -= 1;

                    if (c.phase === 'flashing') {
                        c.flashTimer -= 1;
                        if (c.flashTimer <= 0) respawn(c);
                        continue;
                    }

                    // Eased target-seeking motion (no jitter)
                    for (let a = 0; a < c.agents.length; a++) {
                        const ag = c.agents[a];
                        ag.progress += 1 / ag.duration;
                        if (ag.progress >= 1) {
                            // Pick a new target — slight bias to be near previous, not random teleport
                            ag.sx = ag.tx;
                            ag.sy = ag.ty;
                            const dx = (Math.random() - 0.5) * 0.6;
                            const dy = (Math.random() - 0.5) * 0.6;
                            ag.tx = Math.max(0.12, Math.min(0.88, ag.tx + dx));
                            ag.ty = Math.max(0.12, Math.min(0.88, ag.ty + dy));
                            ag.progress = 0;
                            ag.duration = TARGET_DUR_MIN + Math.random() * (TARGET_DUR_MAX - TARGET_DUR_MIN);
                        }
                        const t = easeInOutCubic(ag.progress);
                        ag.x = ag.sx + (ag.tx - ag.sx) * t;
                        ag.y = ag.sy + (ag.ty - ag.sy) * t;

                        // Trail sampling — only every Nth frame, keeps it sparse and calm
                        ag.trailTick += 1;
                        if (ag.trailTick >= TRAIL_DRAW_EVERY) {
                            ag.trailTick = 0;
                            ag.trail.push([ag.x, ag.y]);
                            if (ag.trail.length > TRAIL_LEN) ag.trail.shift();
                        }
                    }
                    c.step += 1;
                    if (frame > SCALE_FRAMES + HOLD_AFTER_SCALE && c.step >= c.max) {
                        c.phase = 'flashing';
                        c.flashTimer = FLASH_DURATION;
                        c.flashColor = colorFor(Math.min(1, c.step / 280));
                    }
                }
                if (cntNum) cntNum.textContent = String(activeCount);
            };

            const draw = () => {
                const { border, isDark } = getThemeColors();
                const borderRgba = toRgba(border, 0.14);
                const activeBorderRgba = toRgba(border, 0.26);
                const hoverBorderRgba = toRgba(border, 0.75);

                ctx.clearRect(0, 0, widthPx, heightPx);

                // First pass: cell borders & flashes
                for (let r = 0; r < rows; r++) {
                    for (let cIdx = 0; cIdx < cols; cIdx++) {
                        const i = r * cols + cIdx;
                        const c = cells[i];
                        const x = gridX + cIdx * cellW;
                        const y = gridY + r * cellH;

                        ctx.lineWidth = 1;
                        ctx.strokeStyle = c.activated ? activeBorderRgba : borderRgba;
                        if (i === hoverCell && c.activated) {
                            ctx.lineWidth = 1.2;
                            ctx.strokeStyle = hoverBorderRgba;
                        }
                        ctx.strokeRect(Math.round(x) + 0.5, Math.round(y) + 0.5, Math.floor(cellW) - 1, Math.floor(cellH) - 1);

                        // Episode flash — sine fade in & out (ease in/out), softer peak
                        if (c.phase === 'flashing') {
                            const norm = c.flashTimer / FLASH_DURATION;            // 1 → 0
                            const t = 1 - norm;                                    // 0 → 1
                            const alpha = Math.sin(t * Math.PI) * 0.11;            // peaks ~0.11 mid (softer)
                            ctx.fillStyle = toRgba(c.flashColor, alpha);
                            ctx.fillRect(x + 1, y + 1, cellW - 2, cellH - 2);
                        }

                        // Activation pulse — gentle sine in/out, peaks low
                        if (c.activated && c.spawnTimer > 0) {
                            const norm = c.spawnTimer / SPAWN_DURATION;            // 1 → 0
                            const t = 1 - norm;                                    // 0 → 1
                            const wave = Math.sin(t * Math.PI);                    // ease in/out over the lifetime
                            const cellMidColor = colorFor(0.30);
                            ctx.fillStyle = toRgba(cellMidColor, wave * 0.10);
                            ctx.fillRect(x + 1, y + 1, cellW - 2, cellH - 2);
                            ctx.strokeStyle = toRgba(cellMidColor, wave * 0.38);
                            ctx.lineWidth = 1.2;
                            ctx.strokeRect(Math.round(x) + 0.5, Math.round(y) + 0.5, Math.floor(cellW) - 1, Math.floor(cellH) - 1);
                        }
                    }
                }

                // Second pass: agents — calm dots, no additive blending
                ctx.globalCompositeOperation = 'source-over';
                for (let i = 0; i < cells.length; i++) {
                    const c = cells[i];
                    if (!c.activated) continue;
                    if (c.phase === 'flashing') continue;
                    const x0 = gridX + (i % cols) * cellW;
                    const y0 = gridY + Math.floor(i / cols) * cellH;

                    // Fade-in agent on activation
                    const agentAlpha = c.spawnTimer > 0
                        ? easeOutCubic(1 - c.spawnTimer / SPAWN_DURATION)
                        : 1;

                    for (let a = 0; a < c.agents.length; a++) {
                        const ag = c.agents[a];
                        const col = colorFor(Math.min(1, c.step / Math.max(1, c.max)));

                        // Soft trail — short, low alpha
                        for (let k = 0; k < ag.trail.length; k++) {
                            const p = ag.trail[k];
                            const trailAlpha = ((k + 1) / ag.trail.length) * 0.18 * agentAlpha;
                            ctx.fillStyle = toRgba(col, trailAlpha);
                            ctx.beginPath();
                            ctx.arc(x0 + p[0] * cellW, y0 + p[1] * cellH, Math.max(0.8, cellW * 0.030), 0, Math.PI * 2);
                            ctx.fill();
                        }
                        // Agent dot — smaller, single-layer
                        ctx.fillStyle = toRgba(col, 0.85 * agentAlpha);
                        ctx.beginPath();
                        ctx.arc(x0 + ag.x * cellW, y0 + ag.y * cellH, Math.max(1.4, cellW * 0.055), 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
            };

            const tick = () => {
                tickPhysics();
                draw();
                frame += 1;
                rafId = window.requestAnimationFrame(tick);
            };

            // Hover
            const onMove = (e) => {
                const rect = canvas.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                if (x < gridX || y < gridY || x > gridX + gridW || y > gridY + gridH) {
                    hoverCell = -1;
                    tip.style.opacity = '0';
                    tip.style.transform = 'translate(-9999px, -9999px)';
                    return;
                }
                const cIdx = Math.floor((x - gridX) / cellW);
                const r = Math.floor((y - gridY) / cellH);
                const idx = r * cols + cIdx;
                if (idx >= 0 && idx < cells.length) {
                    hoverCell = idx;
                    const c = cells[idx];
                    if (!c.activated) {
                        const remaining = Math.max(0, c.activationFrame - frame);
                        tipInner.innerHTML =
                            `<div style="font-weight:800;letter-spacing:.1px;">Env #${idx} (queued)</div>` +
                            `<div style="font-size:11px;color:var(--muted-color);"><strong>Activates in</strong> ~${(remaining / 60).toFixed(1)}s</div>`;
                    } else {
                        tipInner.innerHTML =
                            `<div style="font-weight:800;letter-spacing:.1px;">Env #${idx}</div>` +
                            `<div style="font-size:11px;color:var(--muted-color);"><strong>Step</strong> ${c.step} / ${c.max}</div>` +
                            `<div style="padding-top:4px;border-top:1px solid var(--border-color);"><strong>Phase</strong> ${c.phase}</div>` +
                            `<div><strong>Agents</strong> ${c.agents.length}</div>`;
                    }
                    tip.style.opacity = '1';
                    let tx = x + 14, ty = y + 16;
                    if (tx + 200 > widthPx) tx = x - 200;
                    if (ty + 80 > heightPx) ty = y - 80;
                    tip.style.transform = `translate(${Math.round(tx)}px, ${Math.round(ty)}px)`;
                }
            };
            const onLeave = () => {
                hoverCell = -1;
                tip.style.opacity = '0';
                tip.style.transform = 'translate(-9999px, -9999px)';
            };
            canvas.addEventListener('mousemove', onMove);
            canvas.addEventListener('mouseleave', onLeave);

            // Pause when offscreen
            const onVis = () => {
                if (document.hidden && rafId != null) {
                    window.cancelAnimationFrame(rafId);
                    rafId = null;
                } else if (!document.hidden && rafId == null) {
                    rafId = window.requestAnimationFrame(tick);
                }
            };
            document.addEventListener('visibilitychange', onVis);

            // Init
            computeLayout();
            if (reducedMotion) {
                for (let i = 0; i < cells.length; i++) cells[i].activated = true;
                frame = SCALE_FRAMES + HOLD_AFTER_SCALE + 1;
                for (let k = 0; k < 30; k++) tickPhysics();
                draw();
                cntNum.textContent = String(cells.length);
            } else {
                rafId = window.requestAnimationFrame(tick);
            }

            const ro = new ResizeObserver(() => {
                computeLayout();
                draw();
            });
            ro.observe(container);
        };

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', () => ensureD3(bootstrap), { once: true });
        } else {
            ensureD3(bootstrap);
        }
    })();
</script>
