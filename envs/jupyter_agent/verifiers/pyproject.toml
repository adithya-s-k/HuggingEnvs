[project]
name = "jupyter-agent-verifiers"
version = "0.1.0"
description = "Jupyter Agent environment using PrimeIntellect Verifiers"
requires-python = ">=3.11"
dependencies = [
    "verifiers>=0.1.0",
    "e2b-code-interpreter>=1.0.0",
    "datasets>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
