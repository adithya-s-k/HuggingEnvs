[project]
name = "wordle-verifiers"
version = "0.1.0"
description = "Wordle environment using PrimeIntellect Verifiers"
requires-python = ">=3.11"
dependencies = [
    "datasets>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
