[project]
name = "wordle-gem"
version = "0.1.0"
description = "Wordle environment using GEM (General Experience Maker)"
requires-python = ">=3.10"
dependencies = [
    "gem-llm>=0.1.0",
    "datasets>=2.0.0",
    "openai>=2.33.0",
    "python-dotenv>=1.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
