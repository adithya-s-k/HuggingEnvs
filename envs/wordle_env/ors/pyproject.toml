[project]
name = "wordle-ors"
version = "0.1.0"
description = "Wordle environment using Open Reward Standard (ORS)"
requires-python = ">=3.10"
dependencies = [
    "openai>=2.33.0",
    "openreward>=0.1.33",
    "pydantic>=2.0.0",
    "python-dotenv>=1.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "datasets>=2.0.0",
]
train = [
    "datasets>=2.0.0",
    "openreward>=0.1.33",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
