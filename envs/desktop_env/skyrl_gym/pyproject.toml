[project]
name = "desktop-skyrl-gym"
version = "0.1.0"
description = "Desktop computer-use environment using SkyRL Gym (BaseTextEnv)"
requires-python = ">=3.10"
dependencies = [
    "skyrl-gym>=0.0.5",
    "e2b-desktop>=2.3.0",
    "e2b>=2.6.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "openai>=2.30.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
