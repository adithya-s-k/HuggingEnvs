[project]
name = "desktop-nemo-gym"
version = "0.1.0"
description = "Desktop computer-use environment using NVIDIA NeMo Gym"
requires-python = ">=3.12"
dependencies = [
    "nemo_gym @ git+https://github.com/NVIDIA-NeMo/Gym",
    "e2b-desktop>=2.3.0",
    "e2b>=2.6.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "openai>=2.7.2",
    "anyio>=4.0",
    "attrs>=23.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
