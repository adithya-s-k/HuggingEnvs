[project]
name = "jupyter-agent-ors"
version = "0.1.0"
description = "Jupyter Agent environment using Open Reward Standard (ORS)"
requires-python = ">=3.10"
dependencies = [
    "openreward>=0.1.33",
    "e2b-code-interpreter>=1.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "openai>=2.33.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "datasets>=2.0.0",
]
client = [
    "openreward>=0.1.33",
]
train = [
    "datasets>=2.0.0",
    "openreward>=0.1.33",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
